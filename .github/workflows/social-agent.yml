name: Ladies of Destiny Agent

# ─────────────────────────────────────────────────────────────────────────────
#  Ladies of Destiny — posts ONE image + ONE caption (written by Google Gemini
#  in the "Lady of Destiny" persona) to the "Ladies Of Destiny" Facebook page
#  AND its Instagram account every day at 10:00 EAT — caption language
#  alternating daily: English one day, Kiswahili the next (owner rule
#  2026-09-22).
#
#  GitHub's cron fires this workflow on TWO schedules:
#    • "3 7 * * *"   — daily 10:03 EAT PUNCTUALITY fire: the first run after
#      the 10:00 slot publishes the Instagram half at ~10:04-10:07 EAT (IG's
#      own API scheduling is not available, so a landed run right after the
#      slot is as close to 10:00 as GitHub can get; owner rule 2026-09-23:
#      "if possible it would also post on ig at 10:00am").
#    • "13,43 * * * *" — 30-min heartbeat around the clock (off-peak minutes
#      — GitHub drops scheduled runs at peak minutes when Actions load is
#      high). Retries for a missed IG half land on these fires within the
#      240-min catch-up window (10:00-14:00 EAT, "graceMinutes" in
#      data/config.json — the SAME 4-hour window Biblia Tafsiri Mbalimbali
#      posts reliably with every day, owner rule 2026-09-24); past the
#      window the day's IG half is skipped (the force button rescues it
#      manually, posting just the IG half).
#  Beyond that, the timing barely matters: every run that lands PRE-SCHEDULES
#  the next "scheduleDays" days (default 3) with META'S OWN scheduled
#  publishing — Meta's servers then publish each Facebook post exactly at
#  10:00 EAT, no matter when or whether GitHub fires again. Instagram halves
#  reuse the slot's pinned image + caption.
#
#  MUTUAL RESCUE (owner rule 2026-09-24): every landed run also checks the
#  sibling pages (data/config.json "siblings") via the GitHub API and
#  dispatches a sibling whose IG half is due but has no landed run of its own
#  — API dispatches are 100% reliable, unlike cron schedules. Needs the
#  dispatch token (data/config.json "dispatchToken" — fine-grained PAT:
#  contents:read + actions:write on the sibling repos; a DISPATCH_TOKEN repo
#  secret would override it). Dispatched runs carry input
#  rescuedBy and skip their own sibling check (one hop, no ping-pong).
#
#  SETUP (once): 1) paste a fresh Graph API Explorer token into
#  data/meta-token.txt and push — the next run finds the page, mints the
#  permanent page token and clears the file. 2) Add the GEMINI_API_KEY secret
#  (repo Settings → Secrets and variables → Actions). 3) Upload images to
#  data/photos/ (any JPG/PNG).
#
#  ⟶ To CHANGE posting time: edit "slots" (and "timezone") in data/config.json
#    only — this file never needs to change.
# ⟶ To POST RIGHT NOW (or rescue a MISSED slot the same day): Actions tab →
#    "Ladies of Destiny Agent" → "Run workflow" → tick "force".
# ⟶ To TEST without publishing: same, but tick "dryRun".
# ⟶ To TEST THE GEMINI KEY (writes one EN + one SW test caption, posts
#    nothing): tick "gemini-test".
# ⟶ To PAUSE: set "autoPost": false in data/config.json — the next landed
#    run also deletes any pending Meta-scheduled posts.
#
#  Free-tier notes (private repo): only runs that START bill minutes (~2-5
#  landed runs/day ≈ 100-300 of the 2000 monthly included minutes). State
#  commits after every posting keep the repo active, so scheduled workflows
#  never get auto-disabled.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "3 7 * * *"    # daily 10:03 EAT punctuality fire for the IG half
    - cron: "13,43 * * * *" # 30-min heartbeat (off-peak minutes)
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Dry run — pick content and log the plan, publish nothing"
        type: boolean
        default: false
      force:
        description: "Force — post the most recent unposted slot right now (rescues a missed slot the same day)"
        type: boolean
        default: false
      gemini-test:
        description: "Gemini self-test — verify the GEMINI_API_KEY secret writes valid EN + SW persona captions (posts nothing)"
        type: boolean
        default: false
      rescuedBy:
        description: "Internal — set automatically when a sibling page's agent dispatched this run (mutual rescue); skips this run's own sibling check"
        type: string
        default: ""

# Never let two runs race on data/state.json
concurrency:
  group: ladies-of-destiny-agent
  cancel-in-progress: false

permissions:
  contents: write # to commit data/state.json back

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Gemini self-test (optional)
        if: inputs.gemini-test == true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node scripts/gemini-selftest.mjs

      # Any file dropped into data/photos/ (phone PNG, huge export, too-small
      # image) is auto-converted/cropped/scaled to platform-safe JPEG and the
      # fix is committed back to the repo.
      - name: Normalize photos
        if: inputs.gemini-test != true
        run: |
          mkdir -p /tmp/norm && cd /tmp/norm
          npm init -y >/dev/null 2>&1
          npm install sharp --silent --no-audit --no-fund >/dev/null 2>&1 || true
          cd "$GITHUB_WORKSPACE"
          NODE_PATH=/tmp/norm/node_modules node scripts/normalize-photos.js \
            || echo "normalize skipped (non-fatal — the agent posts files as-is)"

      - name: Run the agent
        if: inputs.gemini-test != true
        env:
          INPUT_DRY_RUN: ${{ inputs.dryRun }}
          INPUT_FORCE: ${{ inputs.force }}
          INPUT_RESCUED_BY: ${{ inputs.rescuedBy }}
          # Mutual rescue (owner rule 2026-09-24): lets this agent check the
          # sibling pages' repos and dispatch their workflows when a sibling
          # has an IG half due but no landed run of its own. Token: data/config
          # "dispatchToken" (fine-grained PAT, contents:read + actions:write
          # on the sibling repos); this secret, if set, overrides it.
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          # Google Gemini writes the daily captions (Lady of Destiny persona).
          # Without this secret the agent posts the stored fallback captions in
          # data/fallback-captions.json instead (page stays alive).
          # Create a free key at aistudio.google.com/apikey → repo Settings →
          # Secrets and variables → Actions → New repository secret →
          # name: GEMINI_API_KEY
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          FLAGS=""
          if [ "$INPUT_DRY_RUN" = "true" ]; then FLAGS="$FLAGS --dry-run"; fi
          if [ "$INPUT_FORCE" = "true" ]; then FLAGS="$FLAGS --force"; fi
          node scripts/gh-agent.mjs $FLAGS

      - name: Persist state + normalized photos
        if: inputs.gemini-test != true
        run: |
          git config user.name "ladies-agent-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "nothing changed — no commit"
          else
            git commit -m "agent: state update $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push || (git pull --rebase origin main && git push)
          fi
